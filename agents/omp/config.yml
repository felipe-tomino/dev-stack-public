modelRoles:
  web: openai-codex/gpt-6-luna
  default: openai-codex/gpt-6.1-sol
  smol: openai-codex/gpt-6-luna:medium
  task: openai-codex/gpt-6.1-sol:medium
  slow: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
  designer: anthropic/claude-opus-5-5:high
  vision: openai-codex/gpt-6.1-sol:medium
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
skills:
  customDirectories:
    - ~/.omp/agent/personal-skills
    - ~/.agents/skills
  ignoredSkills:
    - devcontainer
async:
  widgets: false
browser:
  enabled: true
  headless: true
  relay: false
  cdpUrl: null
  tern: false
  cmux: false
task:
  completionProbe: false
title:
  refreshOnReplan: false
plan:
  enabled: true
  defaultOnStartup: false
goal:
  enabled: true
ttsr:
  enabled: true
  builtinRules: true
  # Project conventions own style; retain the other native safeguards.
  disabledRules:
    - ts-bare-catch
    - ts-import-type
    - ts-no-dynamic-import
    - ts-no-local-is-record
    - ts-no-return-type
    - ts-no-tiny-functions
    - ts-promise-with-resolvers
    - ts-redundant-clear-guard
    - ts-set-map